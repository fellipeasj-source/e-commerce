
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<header class="topo">
    <h1>Controle de Produtos</h1>
    <p>Crie sua conta para acessar o sistema</p>
</header>

<nav class="menu">
    
    
    <a href="cadastro_contas.html">Criar conta</a>
    <a href="login.html">Login</a>
</nav>

<main class="container">
    <section class="cartao">
        <h2>Criar uma conta</h2>
        <p class="subtitulo">Preencha os dados abaixo para se cadastrar.</p>

        <form name="frm_contas" action="gravar_contas.php" method="post">
            <div class="campo">
                <label for="txt_usuario">Nome de usuário</label>
                <input type="text" id="txt_usuario" name="txt_usuario"
                       maxlength="100" required>
            </div>

            <div class="campo">
                <label for="txt_email">E-mail</label>
                <input type="email" id="txt_email" name="txt_email"
                       maxlength="150" required>
            </div>

            <div class="campo">
                <label for="txt_senha">Senha</label>
                <input type="password" id="txt_senha" name="txt_senha"
                       required>
            </div>

            <div class="acoes">
                <button type="submit" class="botao">Criar conta</button>
                <a href="login.html" class="botao botao-azul">Já tenho conta</a>
            </div>
        </form>
    </section>
</main>

<footer class="rodape">Sistema de Controle de Produtos</footer>

</body>
</html>
